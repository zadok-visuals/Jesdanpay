<!--
  Paste this into: Supabase Dashboard → Authentication → Email Templates → "Confirm signup"
  Subject line suggestion: Confirm your JesDanPay account

  Uses inline styles + a table layout on purpose — email clients like Gmail
  strip <style> blocks in <head>, which would leave this rendering completely
  unstyled for a large share of recipients. Don't reintroduce a <style> tag.

  Logo URL assumes the app is live at https://jesdanpay.net — swap the src
  below if the deployed app ends up on a different domain. Email clients
  can't load images from localhost.

  The button links to {{ .SiteURL }}/auth/confirm using {{ .TokenHash }}
  (type=email, Supabase's own documented value for the "Confirm signup"
  template), NOT {{ .ConfirmationURL }} — that produces a PKCE `code`, and
  exchangeCodeForSession(code) only verifies successfully in the same
  browser that originally signed up, since the PKCE code_verifier lives in
  that browser's storage. A signup confirmation link is routinely opened in
  a different browser/device (e.g. signed up on mobile, confirmed from a
  desktop mail client), so token_hash + verifyOtp is used instead — same
  fix, same reasoning, as the Reset Password template. Verified server-side
  in src/app/auth/confirm/route.ts.
-->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f5faf7;">
  <tr>
    <td align="center" style="padding:40px 16px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px; background-color:#ffffff; border-radius:16px; overflow:hidden; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
        <tr>
          <td style="padding:40px 40px 24px 40px; text-align:center;">
            <img src="https://jesdanpay.net/jesdanpay-logo.png" alt="JesDanPay" width="160" style="display:block; margin:0 auto;" />
          </td>
        </tr>
        <tr>
          <td style="padding:0 40px 8px 40px;">
            <h1 style="margin:0; font-size:22px; line-height:30px; color:#125236; text-align:center;">
              Confirm your email address
            </h1>
          </td>
        </tr>
        <tr>
          <td style="padding:8px 40px 32px 40px;">
            <p style="margin:0; font-size:15px; line-height:23px; color:#4b5563; text-align:center;">
              Welcome to JesDanPay — facilitating suppliers payment to China. Please confirm your
              email address to get started.
            </p>
          </td>
        </tr>
        <tr>
          <td style="padding:0 40px 32px 40px; text-align:center;">
            <a
              href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email&next=/onboarding/kyc"
              style="display:inline-block; background-color:#1b7a4b; color:#ffffff; font-size:15px; font-weight:600; text-decoration:none; padding:14px 32px; border-radius:12px;"
            >
              Confirm email address
            </a>
          </td>
        </tr>
        <tr>
          <td style="padding:0 40px 40px 40px; border-top:1px solid #eeeef1; padding-top:24px; text-align:center;">
            <p style="margin:0; font-size:13px; line-height:18px; color:#9ca3af;">
              JesDanPay ·
              <a href="mailto:support@jesdanpay.com" style="color:#1b7a4b; text-decoration:none;">support@jesdanpay.com</a>
            </p>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
